<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Внутренний ритм</title>
    <script>
      var segmentCount = 1;
      var locationParts = window.location;
      locationParts.replace(
        locationParts.protocol + '//' + locationParts.hostname +
        (locationParts.port ? ':' + locationParts.port : '') +
        locationParts.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        locationParts.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (locationParts.search ? '&' + locationParts.search.slice(1).replace(/&/g, '~and~') : '') +
        locationParts.hash
      );
    </script>
  </head>
  <body></body>
</html>
